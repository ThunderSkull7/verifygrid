<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerifyGrid — audit-grade dataset reconciliation with persistent runs and exportable reports."
    />
    <meta name="theme-color" content="#f6f8fb" />
    <title>VerifyGrid — Data Reconciliation</title>
    <script>
      // Apply the persisted Light/Dark theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var theme = localStorage.getItem('verifygrid_theme');
          if (theme !== 'light' && theme !== 'dark') {
            // Missing, retired "system", or invalid value: resolve once from the OS preference.
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b1120' : '#f6f8fb');
        } catch (e) {
          /* localStorage unavailable — the app will apply defaults after mount. */
        }
      })();
    </script>
    <style>
      /* Minimal pre-hydration surface so the first paint matches the app theme. */
      html {
        background: #f6f8fb;
      }
      html[data-theme='dark'] {
        background: #0b1120;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
