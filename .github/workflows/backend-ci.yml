name: Backend CI

on:
  pull_request:
    branches: [main, feature/*]
    paths:
      - "backend/**"
  push:
    branches: [main, feature/*]
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline test suite (excluding live postgres)
        run: |
          pytest tests -m "not postgres" --maxfail=1 -q

      - name: Run migration target guard test suite
        run: |
          pytest tests/test_migration_env_guard.py -v

      - name: Run financial aggregation correctness regression tests
        run: |
          pytest tests/test_financial_aggregation_batches_a_d.py -v
