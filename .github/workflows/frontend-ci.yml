name: Frontend CI

on:
  pull_request:
    branches: [main, feature/*]
    paths:
      - "frontend/**"
  push:
    branches: [main, feature/*]
    paths:
      - "frontend/**"

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit and component test suites
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
