[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# No sqlalchemy.url is configured on purpose. Migration targets must be
# supplied explicitly for each process (see migrations/env.py). Application
# settings and .env values are never used as a migration target.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
